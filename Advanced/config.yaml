# Advanced RAG Pipeline Configuration
# Override any value with env var: RAG_<SECTION>_<KEY> (uppercase)

loader:
  source_pdf: "100cosas-es.pdf"
  metadata_fields:
    fuente: "100cosas-es"
    seccion_threshold_page: 20

chunking:
  child_chunk_size: 400
  child_chunk_overlap: 50
  parent_chunk_size: 1800
  parent_chunk_overlap: 100

embeddings:
  model: "text-embedding-3-small"
  cache_max_size: 2048
  batch_size: 64

vectorstore:
  provider: "chroma"
  collection_name: "rag_v2"
  persist_directory: "chroma_db"

retriever:
  strategy: "hybrid"          # hybrid | vector | bm25
  vector_k: 8
  bm25_k: 8
  final_k: 6                  # docs returned after reranking
  bm25_weight: 0.35
  vector_weight: 0.65

reranker:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_n: 6
  batch_size: 32

query_expansion:
  enabled: true
  strategy: "hyde"            # hyde | multi_query | none
  hyde_num_hypotheticals: 3
  multi_query_num_variants: 3

llm:
  model: "gpt-4o-mini"
  temperature: 0
  max_tokens: 1024

prompt:
  template: |
    Responde la pregunta basándote SOLO en el siguiente contexto.
    Si no sabes la respuesta, di "No encontré esa información en el documento."

    Contexto: {context}
    Pregunta: {question}

evaluation:
  test_questions:
    - question: "¿Qué proporción del tiempo pasan los programadores leyendo código vs escribiéndolo?"
      ground_truth: "Los programadores pasan el 90% del tiempo leyendo código y solo el 10% escribiéndolo. Robert C. Martin en Clean Code dice que la proporción es de más de 10 a 1."
    - question: "¿Qué es la deuda técnica en el software?"
      ground_truth: "La deuda técnica es la acumulación de desorden en el software causada por parches rápidos, variables mal nombradas y comentarios obsoletos."
    - question: "¿Qué dice Dan Abramov sobre el código limpio?"
      ground_truth: "Dan Abramov escribió 'Goodbye, Clean Code' donde confesó que había refactorizado el código de un compañero para hacerlo más limpio y terminó rompiéndolo todo. Su conclusión fue que el código limpio no es un objetivo, sino una herramienta."
    - question: "¿Cuál es la Regla del Boy Scout aplicada al software?"
      ground_truth: "La Regla del Boy Scout adaptada por Robert C. Martin dice: deja siempre el código un poco mejor de como lo encontraste. Pequeñas victorias continuas contra el desorden."
    - question: "¿Qué es el principio DRY?"
      ground_truth: "DRY significa Don't Repeat Yourself. Es un principio que busca evitar la duplicación de código. Dan Abramov advierte que obsesionarse con DRY puede llevar a abstracciones prematuras."
  metrics:
    - mrr
    - ndcg_at_k
    - hit_rate
    - ragas
  output_file: "evaluation_results.json"

monitoring:
  log_level: "INFO"
  log_format: "json"           # json | console
  log_file: "logs/pipeline.log"
  enable_latency_tracking: true
  enable_metrics_export: true
  metrics_export_file: "logs/metrics.json"
